name: Deploy

# Only after a green CI on main. Order: image → migration (separate job) → deploy → smoke.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nelcota/nelcota

jobs:
  image:
    name: Image on GHCR
    # Only a push to main of this repository: a fork PR with a "main" branch also
    # triggers workflow_run, and must not build an image or migrate production. A manual
    # run is a redeploy of main, never of another branch (it would skip CI and review).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha }}
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=nelcota-image
          cache-to: type=gha,scope=nelcota-image,mode=max

  migrate:
    name: Migrations (migration user)
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: docker run of the new image with the migrator
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.image.outputs.sha }}
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          DOCKER_NETWORK: ${{ vars.DEPLOY_DOCKER_NETWORK || 'coolify' }}
        # The migrator URL goes through stdin and is read inside the container: it does not show up
        # in `ps`, in the docker arguments or in the server's shell history.
        run: |
          printf '%s\n' "$MIGRATOR_DATABASE_URL" | ssh -i ~/.ssh/deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker pull -q '$IMAGE_REF' && docker run --rm -i --network '$DOCKER_NETWORK' \
              '$IMAGE_REF' sh -c 'read -r DATABASE_URL && export DATABASE_URL && exec node migrate.mjs'"

  deploy:
    name: Deploy to Coolify + smoke test
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Coolify webhook (pulls the configured :main or :latest tag)
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
      - name: Wait for the new version to answer on /api/ready
        env:
          EXPECTED: ${{ needs.image.outputs.sha }}
          URL: ${{ vars.APP_URL }}/api/ready
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS "$URL" || true)
            echo "$body" | grep -q "\"version\":\"$EXPECTED\"" && echo "$body" && exit 0
            sleep 10
          done
          echo "Version $EXPECTED did not answer within 10 minutes: check the deploy in Coolify." >&2
          exit 1
