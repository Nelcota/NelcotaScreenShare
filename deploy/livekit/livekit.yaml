# LiveKit Server configuration (self-hosted).
# The keys do NOT live here: they come from the LIVEKIT_KEYS environment variable
# (set in docker-compose.livekit.yml from LIVEKIT_API_KEY/SECRET).

# HTTP/WebSocket signaling. Do NOT open 7880 in the firewall in either mode.
# - Legacy (ROOM_HOST_CONTROLS_ENABLED=false): browsers reach it through Coolify's HTTPS
#   proxy (lk.yourdomain.com -> 127.0.0.1:7880), so it listens on every interface ("").
# - Host controls (ROOM_HOST_CONTROLS_ENABLED=true): only the app talks to it, through the
#   app's relay. Listen only where the app reaches it, the Docker bridge gateway, and remove
#   the lk.* proxy routes (docs/host-controls.md, "Required deployment boundary"):
#     bind_addresses:
#       - "172.17.0.1"
#   A token kept from before the relay would otherwise still reach LiveKit directly.
#   The compose healthcheck then has to ask http://172.17.0.1:7880 instead of 127.0.0.1.
port: 7880
bind_addresses:
  - ""

rtc:
  # ICE/TCP fallback for networks that block UDP. Firewall: 7881/tcp.
  tcp_port: 7881
  # WebRTC media range (UDP). Firewall: 50000-50100/udp.
  # 101 ports are plenty for ~5-8 people (each participant uses few ports).
  port_range_start: 50000
  port_range_end: 50100
  # Discovers the public IP via STUN and advertises it in the ICE candidates.
  use_external_ip: true

turn:
  # Embedded TURN: essential for users behind symmetric NAT / corporate firewalls.
  enabled: true
  # Domain pointing (A record, WITHOUT Cloudflare proxy) to the VPS IP.
  domain: lk.yourdomain.com
  # TURN/UDP. Firewall: 3478/udp.
  udp_port: 3478
  # Ports TURN allocates to relay media (the default would be 30000-40000).
  # Firewall: 30000-30100/udp.
  relay_range_start: 30000
  relay_range_end: 30100
  # TURN/TLS (optional, gets through firewalls that only allow TLS). Firewall: 5349/tcp.
  # Requires a valid certificate for the domain above; see "TURN/TLS" in docs/deployment.md.
  # To enable it, uncomment the 3 lines below and the certificates volume in the compose file.
  # tls_port: 5349
  # cert_file: /etc/livekit/certs/fullchain.pem
  # key_file: /etc/livekit/certs/privkey.pem

room:
  # Safety net: the app already limits it via the token (MAX_PARTICIPANTS).
  max_participants: 8
  empty_timeout: 300
  departure_timeout: 20

# Webhook: LiveKit notifies the app about rooms, joins, leaves and screen shares;
# the admin panel (rooms, participations, metrics) depends on it. `api_key` is the
# same value as LIVEKIT_API_KEY (just the key name, not the secret).
# See "Webhook" in docs/deployment.md.
webhook:
  api_key: replace-with-LIVEKIT_API_KEY
  urls:
    - https://app.yourdomain.com/api/livekit/webhook

logging:
  level: info
  pion_level: error
