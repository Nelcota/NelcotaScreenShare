# Self-hosted LiveKit Server (separate resource in Coolify: "Docker Compose").
#
# Ports to open in the VPS firewall (ufw / provider panel):
#   7881/tcp          -> WebRTC over TCP (fallback when UDP is blocked)
#   50000-50100/udp   -> WebRTC media (RTP/RTCP)
#   3478/udp          -> TURN/UDP
#   30000-30100/udp   -> TURN relay ports (turn.relay_range_* in livekit.yaml)
#   5349/tcp          -> TURN/TLS (only if enabled in livekit.yaml)
#
# Port 7880 (HTTP/WebSocket signaling) must NOT be opened in the firewall.
# Legacy signaling (ROOM_HOST_CONTROLS_ENABLED=false): it goes through Coolify's HTTPS proxy
# at https://lk.yourdomain.com (browsers connect to wss://lk.yourdomain.com); see
# docs/deployment.md. With host controls it must not be public at all: only the app's relay
# talks to it, the lk.* proxy routes go away and LiveKit listens on the Docker bridge
# gateway only (bind_addresses in deploy/livekit/livekit.yaml; docs/host-controls.md).
#
# network_mode: host is required for WebRTC: it avoids Docker NAT on the UDP range
# and lets LiveKit advertise the correct public IP in the ICE candidates.

services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit/livekit.yaml
    environment:
      # Format "key: secret". Set LIVEKIT_API_KEY and LIVEKIT_API_SECRET
      # in the resource variables in Coolify (the same as the app's).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      # TURN/TLS: uncomment and point to the certificate of the TURN domain.
      # - /etc/letsencrypt/live/lk.yourdomain.com:/etc/livekit/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
