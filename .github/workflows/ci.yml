name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting, types and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unused code, exports and dependencies (knip)
        run: pnpm knip
        env:
          # The Vitest and Playwright configs (loaded by knip) only enable the integration and
          # E2E projects when this is set; knip reads them but never connects to the database.
          TEST_DATABASE_URL: postgres://knip:knip@127.0.0.1:5432/knip
      - name: Duplication below the threshold (jscpd)
        run: pnpm dup
      - name: Schema and migrations up to date (no pending migration)
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain drizzle)" || { git status drizzle; exit 1; }
      - name: Production dependencies without high/critical vulnerabilities
        run: pnpm audit --prod --audit-level=high

  test:
    name: Tests (unit + integration on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nelcota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nelcota_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile runs the production build and bundles the deployment scripts.
      - name: Docker image (the same as deploy) builds without errors
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nelcota-ci
          cache-from: type=gha,scope=nelcota-image
          cache-to: type=gha,scope=nelcota-image,mode=max
      - name: Existing password hashes verify in the production image
        run: |
          docker run --rm -i --entrypoint node nelcota-ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { verify } from "@node-rs/argon2";
            const { hash, password } = JSON.parse(readFileSync(0, "utf8"));
            assert.equal(await verify(hash, password), true);
            assert.equal(await verify(hash, password + "-wrong"), false);
          ' < tests/fixtures/argon2-2.2.1.json
      - name: Production container starts and curl can probe its health
        run: |
          cleanup() {
            docker logs nelcota-startup
            docker rm -f nelcota-startup >/dev/null
          }
          trap cleanup EXIT
          docker run -d --name nelcota-startup \
            -e DATABASE_URL=postgres://test:test@127.0.0.1:9/unused \
            -e APP_URL=http://127.0.0.1:3000 \
            -e AUTH_SECRET=test-startup-secret-0123456789abcdef \
            -e LIVEKIT_URL=ws://127.0.0.1:9 \
            -e LIVEKIT_API_KEY=test \
            -e LIVEKIT_API_SECRET=test-startup-livekit-0123456789abcdef \
            nelcota-ci
          docker exec nelcota-startup curl --version >/dev/null
          for _ in $(seq 1 60); do
            if docker exec nelcota-startup curl --fail --silent \
              http://127.0.0.1:3000/api/health >/tmp/nelcota-health.json; then
              node -e 'const fs = require("node:fs"); const assert = require("node:assert/strict"); assert.equal(JSON.parse(fs.readFileSync("/tmp/nelcota-health.json", "utf8")).status, "ok");'
              exit 0
            fi
            sleep 2
          done
          exit 1

  e2e:
    name: E2E (real Playwright, Postgres and LiveKit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nelcota_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nelcota_test
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-0123456789abcdef0123456789abcdef
      LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Development LiveKit
        run: |
          livekit_image=$(docker compose -f docker-compose.livekit.yml config --images livekit)
          docker run -d --name lk --network host \
            -e LIVEKIT_KEYS="$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET" \
            "$livekit_image" --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Collaboration with private signaling admission
        run: pnpm test:e2e tests/e2e/host-controls.spec.ts tests/e2e/annotations.spec.ts tests/e2e/workspaces.spec.ts tests/e2e/collaboration-smoke.spec.ts
        env:
          E2E_HOST_CONTROLS: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
