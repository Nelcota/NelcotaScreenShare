# Nelcota's postgresql.conf on Coolify ("Custom PostgreSQL configuration").
# WARNING: Coolify REPLACES the whole file with this one. Anything not listed
# here falls back to the Postgres default.
#
# Profile: 4 GB VPS shared with the app (~2 GB for Postgres).
# For 8 GB (~4 GB for Postgres), use the values commented with "8GB:".

listen_addresses = '*'                  # Coolify internal network (port is not published)
max_connections = 50                    # 8GB: 100. App uses a pool of 10 + migration job + headroom
password_encryption = scram-sha-256

# Memory
shared_buffers = 512MB                  # 8GB: 1GB
effective_cache_size = 1536MB           # 8GB: 3GB
work_mem = 8MB                          # 8GB: 12MB
maintenance_work_mem = 128MB            # 8GB: 256MB

# Disk (SSD/NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and checkpoints
wal_buffers = 16MB
min_wal_size = 512MB                    # 8GB: 1GB
max_wal_size = 2GB                      # 8GB: 4GB
checkpoint_completion_target = 0.9

# Statistics and diagnostics
default_statistics_target = 100
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
auto_explain.log_min_duration = '2s'
auto_explain.log_analyze = off

# Logs (go to the container's stdout; Coolify shows them)
log_min_duration_statement = 500ms
# Logged statements keep their text but not their values (e-mails, searches, messages).
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_timezone = 'America/Sao_Paulo'
timezone = 'UTC'                        # the database stores and computes in UTC; the app converts
